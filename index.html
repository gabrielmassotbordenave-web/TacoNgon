<style>
:root{
  --bg:#E9E2D1; --card:#FBF9F2; --ink:#221E16; --ink2:#6C6456; --ink3:#A79D89;
  --bdr:#DED5BF; --bdr2:#EAE3D2;
  --jade:#1E7A6B; --jade-l:#2A9384; --jade-d:#155E52; --cream:#EDF3EE;
  --red:#D33C27; --red-bg:#F6E2DA; --red-ink:#9c3320;
  --amber:#DE9A2A; --amber-bg:#F5E6C6; --amber-ink:#7d5610;
  --ok:#3B8A57; --ok-bg:#DEEBDF;
  --teal:#2C7E8E; --teal-bg:#DCE9EC;
  --sans:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.42;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.num,input,.bv,.v,.q,.q2,.c,.bs b{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:20;background:var(--jade);color:var(--cream);
  padding:calc(15px + env(safe-area-inset-top)) 18px 13px;box-shadow:0 2px 0 var(--red), 0 3px 10px rgba(10,59,52,.18)}
.brand{display:flex;align-items:baseline;gap:8px}
header h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1}
header .tag{font-size:10.5px;font-weight:600;color:rgba(237,243,238,.72);letter-spacing:.01em}
header .sub{font-size:12.5px;color:rgba(237,243,238,.85);margin-top:3px;font-weight:500}

main{padding:16px 14px 8px;max-width:640px;margin:0 auto}
.panel{display:none}.panel.on{display:block;animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.panel.on{animation:none}}

.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(34,30,22,.05)}
.card.pad0{padding:0;overflow:hidden}
.rowline{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--bdr2)}
.rowline:last-child{border-bottom:none}
.grow{flex:1;min-width:0}.muted{color:var(--ink3)}.tiny{font-size:12px;color:var(--ink2)}.right{margin-left:auto}
.sectlabel{font-size:12.5px;font-weight:700;color:var(--ink2);margin:22px 2px 9px;letter-spacing:.01em}
.sectlabel:first-child{margin-top:4px}

.banner{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:11px;font-size:13px;margin-bottom:12px;line-height:1.38}
.banner.warn{background:var(--amber-bg);color:var(--amber-ink);border:1px solid #E9D4A2}
.banner.info{background:var(--ok-bg);color:#2c5c3c;border:1px solid #CBDECF}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap;letter-spacing:.01em}
.chip.pill-chicken{background:var(--amber-bg);color:var(--amber-ink)}
.chip.pill-fish{background:var(--teal-bg);color:#1f5f6c}
.chip.pill-pork{background:var(--red-bg);color:var(--red-ink)}
.chip.fc-ok{background:var(--ok-bg);color:#2c6b43}
.chip.fc-warn{background:var(--amber-bg);color:var(--amber-ink)}
.chip.fc-bad{background:var(--red-bg);color:var(--red-ink)}
.saucetag{font-size:11px;font-weight:600;color:var(--ink2);border:1px solid var(--bdr);padding:2px 8px;border-radius:6px}

/* jade hero board (Coût) */
.board{background:var(--jade);border-radius:13px;padding:16px 16px 15px;margin-bottom:14px;color:var(--cream);
  display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(10,59,52,.2)}
.board-main{flex:1}
.board .bv{font-size:38px;font-weight:800;line-height:.95;letter-spacing:-.03em}
.board .bl{font-size:12px;font-weight:600;color:rgba(237,243,238,.78);margin-top:5px}
.board-side{display:flex;gap:9px}
.board .bs{background:rgba(255,255,255,.09);border-radius:9px;padding:9px 12px;text-align:center;min-width:58px}
.board .bs b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.board .bs small{font-size:10px;color:rgba(237,243,238,.78);font-weight:600}

.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:13px 10px;text-align:center;position:relative}
.kpi::before{content:"";position:absolute;top:-1px;left:14px;right:14px;height:2px;background:var(--jade);border-radius:2px;opacity:.85}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--jade)}
.kpi .l{font-size:11px;color:var(--ink2);margin-top:3px;font-weight:600}

.taco-name{font-weight:700;font-size:14.5px}
.taco-meta{font-size:12px;color:var(--ink2);margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.costblock{text-align:right;flex-shrink:0}.costblock .c{font-size:17px;font-weight:800;letter-spacing:-.02em}
.costblock .m{font-size:11px;margin-top:3px;display:flex;gap:6px;justify-content:flex-end;align-items:center}

label.fld{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bdr2)}
label.fld:last-child{border-bottom:none}
label.fld .name{flex:1;font-size:14px}label.fld .u{font-size:11px;color:var(--ink3);width:42px;text-align:right;font-weight:600}
input[type=number],input[type=text]{font-weight:600;font-size:15px;width:90px;text-align:right;
  padding:9px 10px;border:1.5px solid var(--bdr);border-radius:9px;background:#fff;color:var(--ink);font-family:var(--sans)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px rgba(15,81,71,.1)}
input.empty{border-color:#E0B7A8;background:#FBEEE8}

.qbtns{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.qbtns button{font-family:var(--sans);font-weight:600;font-size:13px;padding:8px 13px;border:1px solid var(--bdr);background:var(--card);color:var(--ink);border-radius:9px}
.qbtns button:active{background:var(--bg)}
.pctrow{display:flex;gap:8px;margin:8px 0}
.pctrow .pcol{flex:1;text-align:center}
.pctrow .pcol .lab{font-size:11px;color:var(--ink2);font-weight:600;margin-bottom:5px}
.pctrow .pcol input{width:100%;text-align:center;padding:10px 4px}

.step{display:flex;gap:9px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--bdr2)}
.step:last-child{border-bottom:none}.step .n{flex:1}.step .n .t{font-weight:600;font-size:14px}
.step .n .d{font-size:12px;color:var(--ink2);margin-top:2px}.step .r{text-align:right;flex-shrink:0}
.step .r .q{font-weight:800;font-size:15px;letter-spacing:-.01em}.step .r .q2{font-size:11px;color:var(--ink2);margin-top:2px;font-weight:600}

.act{width:100%;font-family:var(--sans);font-weight:700;font-size:14.5px;padding:14px;border-radius:11px;border:none;margin-bottom:9px}
.act.solid{background:var(--jade);color:var(--cream)}.act.ghost{background:var(--card);color:var(--ink);border:1px solid var(--bdr)}
.act.danger{background:var(--card);color:var(--red);border:1px solid #E0B7A8}.act:active{opacity:.88}

details.rec{background:var(--card);border:1px solid var(--bdr);border-radius:12px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(34,30,22,.05)}
details.rec>summary{list-style:none;padding:14px;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
details.rec>summary::-webkit-details-marker{display:none}
details.rec[open]>summary{border-bottom:1px solid var(--bdr2)}
details.rec>summary .caret{color:var(--jade);transition:transform .15s;font-size:11px}
details.rec[open]>summary .caret{transform:rotate(90deg)}
.recbody{padding:6px 14px 14px}
.frow{display:flex;align-items:center;gap:8px;margin:11px 0}
.frow>label{font-size:12px;color:var(--ink2);width:80px;flex-shrink:0;font-weight:600}
.frow input,.frow select{flex:1;width:auto;text-align:left}
.frow input.num-r{max-width:98px;text-align:right;flex:none}
.subhead{font-size:11.5px;margin:16px 0 7px;font-weight:700;color:var(--jade);letter-spacing:.02em}
.ing{display:flex;align-items:center;gap:6px;margin:7px 0}
.ing select,.ing input.iname{flex:1;min-width:0;font-weight:500;font-size:13.5px;text-align:left;width:auto}
.ing input.iq{width:68px;flex:none;text-align:right}
.ing select.iu2{max-width:68px;flex:none;font-weight:500}
.ing .iu{font-size:11px;color:var(--ink3);width:26px;flex-shrink:0;font-weight:600}

  if(!s.dist)s.dist={total:'',prot:{Chicken:34,Fish:33,Pork:33},sauce:{Tamarin:34,Wasabi:33,Gingembre:33}};
  ensureScaling(s);
  return s;
}
function fresh(){const d=JSON.parse(JSON.stringify(SEED));
  d.settings={target_fc:30,buffer:1.10};d.event={};
  d.dist={total:'',prot:{Chicken:34,Fish:33,Pork:33},sauce:{Tamarin:34,Wasabi:33,Gingembre:33}};
  ensureScaling(d);
  return d;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function ensureScaling(d){if(!d||!d.subs)return;var FRAC={'Tortillas':0.55,'Chou émincé':0.15,'Chou rouge émincé':0.15,'Coriandre lavée':0.1,'Pickles':0.3,'Sauce Tamarin':0.8,'Sauce Wasabi':0.85,'Sauce Gingembre':0.8,'Poulet Pané':0.3,'Poisson Pané':0.3,'Pork Belly Cuit':0.92,'Mot Hoi An':0.85};d.subs.forEach(function(s){if(s.t_fixe==null||s.t_var==null){var pm=+s.prep_min||0;var f=FRAC[s.output_item]!=null?FRAC[s.output_item]:0.4;var tf=Math.round(pm*f);if(s.t_fixe==null)s.t_fixe=tf;if(s.t_var==null)s.t_var=Math.max(0,pm-tf);}});}
function prepIng(l){var scale=l.scale;var o='<div class="pingwrap">';l.s.ingredients.forEach(function(i){o+='<div class="ping"><span>'+esc(i.item)+'</span><span class="pq">'+qty(i.qty*scale,i.unit)+'</span></div>';});if(!l.s.ingredients.length)o+='<div class="tiny">Aucun ingrédient renseigné.</div>';var _in=(l.s.instructions||'').trim();if(_in){var _st=_in.split(/\.\s+/).map(function(x){return x.trim();}).filter(Boolean);o+='<div class="pmethod"><div class="pmh">Méthode</div><ol>';_st.forEach(function(st){o+='<li>'+esc(st.replace(/\.$/,''))+'</li>';});o+='</ol></div>';}return o+'</div>';}
function costBreak(r){var t=r.t;var total=r.cost;var rows=[];
  t.ingredients.forEach(function(i){var s=subByOut(i.item);if(!s)return;var u=subUnitCost(s);rows.push({name:i.item,cost:i.qty*u.cost,miss:u.miss});});
  rows.sort(function(a,b){return b.cost-a.cost;});
  var o='<div class="cbreak">';
  rows.forEach(function(x){var p=(total>0)?Math.round(x.cost/total*100):0;
    o+='<div class="cbrow"><span class="cbn">'+esc(x.name)+(x.miss?' <span class="tiny" style="color:var(--red)">prix ?</span>':'')+'</span><span class="cbp">'+(total>0?p+' %':'')+'</span><span class="cbc">'+money(x.cost)+'</span></div>';});
  o+='<div class="cbrow cbtot"><span class="cbn">Prix de vente</span><span class="cbp"></span><span class="cbc">'+money(t.price)+'</span></div>';
  return o+'</div>';}

function esc(s){return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rawMap(){const m={};state.raw.forEach(r=>m[r.item]=r);return m;}
function subByOut(o){return state.subs.find(s=>s.output_item===o);}
function money(n){return(Math.round(n*100)/100).toFixed(2).replace('.',',')+'\u00A0$';}
function pct(n){return(Math.round(n*10)/10).toString().replace('.',',')+'\u00A0%';}
function qty(v,u){
  if(u==='kg')return v>=1?v.toFixed(2).replace('.',',')+'\u00A0kg':Math.round(v*1000)+'\u00A0g';
  if(u==='L')return v>=1?v.toFixed(2).replace('.',',')+'\u00A0L':Math.round(v*1000)+'\u00A0ml';
  return(Math.round(v*100)/100).toString().replace('.',',')+'\u00A0'+u;
}
function subUnitCost(s){const rm=rawMap();let c=0,miss=false;
  s.ingredients.forEach(i=>{if(FREE.includes(i.item))return;const r=rm[i.item];const p=r&&r.price?r.price:0;if(!p)miss=true;c+=i.qty*p;});
  return{cost:s.output_qty?c/s.output_qty:0,miss};}
function tacoCost(t){let c=0,miss=false;
  t.ingredients.forEach(i=>{const s=subByOut(i.item);if(!s)return;const u=subUnitCost(s);if(u.miss)miss=true;c+=i.qty*u.cost;});
  return{cost:c,miss};}
function outputNeeds(){const need={};
  state.tacos.forEach(t=>{const n=+state.event[t.id]||0;if(!n)return;
    t.ingredients.forEach(i=>{need[i.item]=(need[i.item]||0)+n*i.qty;});});return need;}
function totalTacos(){return state.tacos.reduce((a,t)=>a+(+state.event[t.id]||0),0);}
function missingCount(){return state.raw.filter(r=>r.active&&!r.price&&!FREE.includes(r.item)).length;}
function anyPriceMissing(){return missingCount()>0;}

function recomputeActive(){
  const usedSubs=new Set();
  state.tacos.forEach(t=>t.ingredients.forEach(i=>usedSubs.add(i.item)));
  state.subs.forEach(s=>s.active=usedSubs.has(s.output_item));
  const usedRaw=new Set();
  state.subs.filter(s=>s.active).forEach(s=>s.ingredients.forEach(i=>{
    if(!i.item)return;usedRaw.add(i.item);
    if(!state.raw.find(r=>r.item===i.item))state.raw.push({item:i.item,unit:i.unit||'kg',price:0,active:true});
  }));
  state.raw.forEach(r=>r.active=usedRaw.has(r.item));
}

/* ===== COÛT ===== */
function renderCost(){
  const el=document.getElementById('p-cost');const target=state.settings.target_fc;
  const rows=state.tacos.map(t=>({t,...tacoCost(t)}));

  const avgFc=complete.length?complete.reduce((a,r)=>a+r.cost/r.t.price*100,0)/complete.length:null;

  let h='';
  if(anyPriceMissing())h+=`<div class="banner warn"><span>⚠️</span><div><b>${missingCount()} prix manquants.</b> Le coût s'affiche seulement pour les tacos entièrement chiffrés. Entre les prix dans <b>Données → Prix</b>.</div></div>`;
  h+=`<div class="board"><div class="board-main"><div class="bv">${avgFc!=null?pct(avgFc):'—'}</div><div class="bl">Food cost moyen</div></div><div class="board-side"><div class="bs"><b>${pct(target)}</b><small>cible</small></div><div class="bs"><b>${complete.length?over:'—'}</b><small>au-dessus</small></div></div></div>`;
  h+='<div class="card pad0">';
  rows.forEach(r=>{const t=r.t;const fc=t.price?r.cost/t.price*100:null;const marge=t.price?t.price-r.cost:null;
    let fcChip='';if(!r.miss&&fc!=null){const cls=fc<=target?'fc-ok':(fc<=target+8?'fc-warn':'fc-bad');fcChip=`<span class="chip ${cls}">${pct(fc)}</span>`;}
    const susp=t.ingredients.some(i=>SUSPECT.includes(i.item));

      <div class="taco-name">${esc(t.name)}${susp?' ⚠️':''}</div>
      <div class="taco-meta"><span class="chip ${PILL[t.protein]||''}">${PROT_FR[t.protein]||t.protein}</span><span class="saucetag">${esc(t.sauce)}</span></div>
    </div><div class="costblock">${r.miss?'<div class="c muted">—</div><div class="m tiny">prix manquant</div>'
      :`<div class="c">${money(r.cost)}</div><div class="m">${fcChip} <span class="tiny">marge ${money(marge)}</span></div>`}</div><span class="pcaret ccaret">▸</span></summary>${costBreak(r)}</details>`;});
  h+='</div>';

/* ===== PREP ===== */
function distSum(o){return PROTS.reduce((a,p)=>a+(+o[p]||0),0);}
function sauceSum(){return SAUCES.reduce((a,s)=>a+(+state.dist.sauce[s]||0),0);}
function applyDist(){
  const total=+state.dist.total||0;const P=state.dist.prot,S=state.dist.sauce;
  const cells=[];PROTS.forEach(p=>SAUCES.forEach(s=>cells.push({p,s,frac:total*(+P[p]||0)/100*(+S[s]||0)/100})));
  const floors=cells.map(c=>Math.floor(c.frac));
  let left=total-floors.reduce((a,b)=>a+b,0);
  const order=cells.map((c,i)=>({i,r:c.frac-floors[i]})).sort((a,b)=>b.r-a.r);
  for(let k=0;k<left&&k<order.length;k++)floors[order[k].i]++;
  state.tacos.forEach(t=>{const idx=cells.findIndex(c=>c.p===t.protein&&c.s===t.sauce);if(idx>=0)state.event[t.id]=floors[idx];});
  save();
}
function renderPrep(){
  const el=document.getElementById('p-prep');const need=outputNeeds();const tot=totalTacos();
  const lines=state.subs.filter(s=>s.active&&need[s.output_item]).map(s=>{const n=need[s.output_item];
    const scale=s.output_qty?n/s.output_qty:0;
    const t=Math.round((+s.t_fixe||0)+(+s.t_var||0)*scale);
    return{s,n,scale,t};});
  const totMin=lines.reduce((a,l)=>a+l.t,0);
  const pS=distSum(state.dist.prot),sS=sauceSum();
  let h='';

  h+='<div class="pctrow">'+PROTS.map(p=>`<div class="pcol"><div class="lab">${PROT_FR[p]}</div><div class="pcinput"><input type="number" min="0" step="1" inputmode="numeric" data-distp="${p}" value="${state.dist.prot[p]}"><i>%</i></div></div>`).join('')+'</div>';
  h+='<div class="disthead"><span>Répartition sauces</span><span class="'+(sS==100?'dok':'dbad')+'">'+sS+' %</span></div>';
  h+='<div class="pctrow">'+SAUCES.map(s=>`<div class="pcol"><div class="lab">${s}</div><div class="pcinput"><input type="number" min="0" step="1" inputmode="numeric" data-dists="${s}" value="${state.dist.sauce[s]}"><i>%</i></div></div>`).join('')+'</div>';
  h+=`<button class="act solid" id="applyDist" style="margin-top:12px;margin-bottom:0">Répartir sur les tacos</button>`;
  h+='</div>';

  h+='<div class="qbtns"><span class="tiny" style="align-self:center">Ajustement manuel</span><button data-fill="0">Vider</button></div>';
  ['Chicken','Fish','Pork'].forEach(pr=>{const list=state.tacos.filter(t=>t.protein===pr);if(!list.length)return;
    h+='<div class="card pad0">';list.forEach(t=>{h+=`<label class="fld"><span class="name"><span class="chip ${PILL[pr]}">${PROT_FR[pr]}</span> ${esc(t.sauce)}</span><input type="number" min="0" step="1" inputmode="numeric" data-ev="${t.id}" value="${state.event[t.id]||''}" placeholder="0"></label>`;});h+='</div>';});
  const others=state.tacos.filter(t=>!PROTS.includes(t.protein));
  if(others.length){h+='<div class="card pad0">';others.forEach(t=>{h+=`<label class="fld"><span class="name">${esc(t.name)}</span><input type="number" min="0" step="1" inputmode="numeric" data-ev="${t.id}" value="${state.event[t.id]||''}" placeholder="0"></label>`;});h+='</div>';}

  h+=`<div class="kpis" style="margin-top:6px">
    <div class="kpi"><div class="v">${tot}</div><div class="l">Tacos</div></div>
    <div class="kpi"><div class="v">${lines.length}</div><div class="l">Sous-rec.</div></div>
    <div class="kpi"><div class="v">${Math.round(totMin/60*10)/10}h</div><div class="l">Prep totale</div></div></div>`;
  h+='<div class="sectlabel">À préparer</div>';
  if(!tot)h+='<div class="empty">Répartis un total ou saisis des quantités pour générer la fiche.</div>';
  else{h+='<div class="card pad0">';lines.forEach(l=>{const susp=SUSPECT.includes(l.s.output_item);
    h+=`<details class="pstep"><summary class="step"><div class="n"><div class="t">${esc(l.s.name)}${susp?' ⚠️':''}</div>
      <div class="d">${"à l'échelle ×"+(Math.round(l.scale*10)/10).toString().replace(".",",")}</div></div>
      <div class="r"><div class="q">${qty(l.n,l.s.output_unit)}</div><div class="q2">${l.t} min</div></div><span class="pcaret">▸</span></summary>${prepIng(l)}</details>`;});
    h+='</div><button class="act ghost" id="copyPrep">📋 Copier la fiche</button>';}
  el.innerHTML=h;
}

function renderShop(){

  const rn={};state.subs.filter(s=>s.active).forEach(s=>{const n=need[s.output_item]||0;if(!n||!s.output_qty)return;const sc=n/s.output_qty;
    s.ingredients.forEach(i=>{if(!i.item)return;if(!rn[i.item])rn[i.item]={qty:0,unit:i.unit};rn[i.item].qty+=i.qty*sc;});});
  const items=Object.keys(rn).sort((a,b)=>a.localeCompare(b,'fr'));let total=0,someMiss=false;
  let h='';
  h+=`<div class="qbtns"><span class="tiny" style="align-self:center">Marge d'achat</span>

  h+=`<div class="banner info"><span>🛒</span><div>Quantités d'<b>achat</b> = besoin de prod × marge (${pct((buf-1)*100)}). Les ratios du fichier sont des quantités d'adhérence — la marge couvre pertes et arrondis.</div></div>`;

  h+=`<button class="act ghost" id="expData">⬇️ Exporter (sauvegarde)</button>`;h+=`<button class="act ghost" id="impData">⬆️ Importer une sauvegarde</button>`;
  h+=`<button class="act danger" id="resetData">↺ Réinitialiser au fichier d'origine</button>`;
  h+=`<div class="tiny" style="padding:4px 4px 0">Tes modifs (prix, recettes, réglages) sont sauvegardées automatiquement sur cet appareil.</div>`;
  el.innerHTML=h;
}

/* ===== routing ===== */
const R={cost:renderCost,prep:renderPrep,shop:renderShop,rec:renderRecipes,data:renderData};
let cur='cost';
function go(tab){cur=tab;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('p-'+tab).classList.add('on');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===tab));
  document.getElementById('hsub').textContent=TITLES[tab];R[tab]();window.scrollTo(0,0);}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ===== toast/export ===== */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1600);}
function copy(t,msg){navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>prompt('Copie manuelle :',t));}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='taco-ngon-data.json';a.click();toast('Exporté');}
function importJSON(){var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var dd=JSON.parse(r.result);if(!dd||!Array.isArray(dd.tacos)||!Array.isArray(dd.subs)||!Array.isArray(dd.raw))throw 0;if(!confirm('Remplacer toutes les données actuelles par ce fichier ?'))return;state=migrate(dd);recomputeActive();save();go(cur);toast('Importé');}catch(e){alert('Fichier invalide — ce n\'est pas une sauvegarde Taco Ngon.');}};r.readAsText(f);};inp.click();}
function copyPrep(){const need=outputNeeds();let txt='FICHE PREP — '+totalTacos()+' tacos\n\n';
  state.subs.filter(s=>s.active&&need[s.output_item]).forEach(s=>{const n=need[s.output_item];const scale=s.output_qty?n/s.output_qty:0;var tm=Math.round((+s.t_fixe||0)+(+s.t_var||0)*scale);var lab='×'+(Math.round(scale*10)/10);
    txt+='• '+s.name+': '+qty(n,s.output_unit)+' — '+lab+', '+tm+' min\n';});copy(txt,'Fiche copiée');}
function copyShop(){const need=outputNeeds();const buf=state.settings.buffer;const rn={};
  state.subs.filter(s=>s.active).forEach(s=>{const n=need[s.output_item]||0;if(!n)return;const sc=n/s.output_qty;
    s.ingredients.forEach(i=>{if(!i.item)return;if(!rn[i.item])rn[i.item]={q:0,u:i.unit};rn[i.item].q+=i.qty*sc;});});
  let txt='LISTE DE COURSES (marge +'+Math.round((buf-1)*100)+'%)\n\n';
  Object.keys(rn).sort((a,b)=>a.localeCompare(b,'fr')).forEach(it=>txt+='☐ '+it+': '+qty(rn[it].q*buf,rn[it].u)+'\n');copy(txt,'Liste copiée');}

/* ===== INPUT (valeurs, sans re-render) ===== */
document.addEventListener('input',e=>{const d=e.target.dataset;const v=e.target.value;
  if(d.ev!==undefined){state.event[d.ev]=+v||0;save();}
  else if(d.dist==='total'){state.dist.total=v;save();}
  else if(d.distp){state.dist.prot[d.distp]=+v||0;save();}
  else if(d.dists){state.dist.sauce[d.dists]=+v||0;save();}
  else if(d.set){state.settings[d.set]=+v||0;save();}
  else if(d.price!==undefined){const r=state.raw.find(x=>x.item===d.price);if(r){r.price=+v||0;e.target.classList.toggle('empty',!r.price);save();}}
  else if(d.tf!==undefined){const t=state.tacos.find(x=>x.id==d.tf);if(t){t[d.k]=(d.k==='price')?(+v||0):v;save();}}
  else if(d.tiq!==undefined){const t=state.tacos.find(x=>x.id==d.tiq);if(t&&t.ingredients[d.idx]){t.ingredients[d.idx].qty=+v||0;save();}}
  else if(d.sf!==undefined){const s=state.subs.find(x=>x.id==d.sf);if(s){s[d.k]=(d.k==='output_qty'||d.k==='prep_min'||d.k==='t_fixe'||d.k==='t_var')?(+v||0):v;save();}}
  else if(d.siq!==undefined){const s=state.subs.find(x=>x.id==d.siq);if(s&&s.ingredients[d.idx]){s.ingredients[d.idx].qty=+v||0;save();}}
});

/* ===== CHANGE (selects & renommages → re-render ciblé) ===== */
document.addEventListener('change',e=>{const d=e.target.dataset;const v=e.target.value;
  if(d.tfc!==undefined){const t=state.tacos.find(x=>x.id==d.tfc);if(t){t[d.k]=v;save();}}
  else if(d.tii!==undefined){const t=state.tacos.find(x=>x.id==d.tii);if(t&&t.ingredients[d.idx]){t.ingredients[d.idx].item=v;const su=subByOut(v);if(su)t.ingredients[d.idx].unit=su.output_unit;recomputeActive();save();lastOpen='t'+d.tii;renderRecipes();}}
  else if(d.sfc!==undefined){const s=state.subs.find(x=>x.id==d.sfc);if(s){
      if(d.k==='output_item'){const old=s.output_item;s.output_item=v;state.tacos.forEach(t=>t.ingredients.forEach(i=>{if(i.item===old)i.item=v;}));recomputeActive();save();lastOpen='s'+d.sfc;renderRecipes();}
      else{s[d.k]=v;save();}}}
  else if(d.sii!==undefined){const s=state.subs.find(x=>x.id==d.sii);if(s&&s.ingredients[d.idx]){s.ingredients[d.idx].item=v;recomputeActive();save();lastOpen='s'+d.sii;renderRecipes();}}
  else if(d.siu!==undefined){const s=state.subs.find(x=>x.id==d.siu);if(s&&s.ingredients[d.idx]){s.ingredients[d.idx].unit=v;const r=state.raw.find(x=>x.item===s.ingredients[d.idx].item);if(r)r.unit=v;save();}}
});

/* ===== CLICK (boutons & structure) ===== */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.fill!==undefined){const val=+d.fill;state.tacos.forEach(t=>state.event[t.id]=val);save();renderPrep();}
  else if(d.buf!==undefined){state.settings.buffer=+d.buf;save();renderShop();}
  else if(b.id==='applyDist'){applyDist();renderPrep();toast('Réparti');}
  else if(b.id==='copyPrep'){copyPrep();}
  else if(b.id==='copyShop'){copyShop();}
  else if(b.id==='expData'){exportJSON();}
  else if(b.id==='impData'){importJSON();}
  else if(b.id==='resetData'){if(confirm('Réinitialiser toutes les données aux valeurs du fichier ? Tes prix et modifs seront effacés.')){state=fresh();save();go(cur);toast('Réinitialisé');}}
  /* taco edits */
  else if(d.taddi!==undefined){const t=state.tacos.find(x=>x.id==d.taddi);const used=new Set(t.ingredients.map(i=>i.item));
    const av=state.subs.map(s=>s.output_item).find(o=>!used.has(o))||(state.subs[0]&&state.subs[0].output_item);const su=subByOut(av);
    t.ingredients.push({item:av||'',qty:0,unit:su?su.output_unit:'kg'});recomputeActive();save();lastOpen='t'+d.taddi;renderRecipes();}
  else if(d.trmi!==undefined){const t=state.tacos.find(x=>x.id==d.trmi);t.ingredients.splice(+d.idx,1);recomputeActive();save();lastOpen='t'+d.trmi;renderRecipes();}
  else if(d.tdel!==undefined){if(confirm('Supprimer ce taco ?')){state.tacos=state.tacos.filter(x=>x.id!=d.tdel);delete state.event[d.tdel];recomputeActive();save();renderRecipes();toast('Taco supprimé');}}
  else if(b.id==='newTaco'){const id=Math.max(0,...state.tacos.map(t=>+t.id))+1;
    state.tacos.push({id,name:'Nouveau taco',protein:'Pork',sauce:'',price:3.5,ingredients:[{item:'Tortillas',qty:1,unit:'unité'}]});
    recomputeActive();save();lastOpen='t'+id;renderRecipes();}
  /* sub edits */
  else if(d.saddi!==undefined){const s=state.subs.find(x=>x.id==d.saddi);s.ingredients.push({item:'',qty:0,unit:'kg'});save();lastOpen='s'+d.saddi;renderRecipes();}
  else if(d.srmi!==undefined){const s=state.subs.find(x=>x.id==d.srmi);s.ingredients.splice(+d.idx,1);recomputeActive();save();lastOpen='s'+d.srmi;renderRecipes();}
  else if(d.sdel!==undefined){if(confirm('Supprimer cette sous-recette ?')){state.subs=state.subs.filter(x=>x.id!=d.sdel);recomputeActive();save();renderRecipes();toast('Sous-recette supprimée');}}
  else if(b.id==='newSub'){const id=Math.max(0,...state.subs.map(s=>+s.id))+1;
    state.subs.push({id,name:'Nouvelle sous-recette',output_item:'Nouveau produit '+id,output_qty:1,output_unit:'kg',loss_pct:0,prep_min:0,active:false,ingredients:[]});
    save();lastOpen='s'+id;renderRecipes();}
});

go('cost');
</script>
</body>
